  <text x="82" y="54" fill="#dffcff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2">SYSTEMS ENGINEERING CONTROL SURFACE</text>
  <text x="82" y="72" fill="#6d8292" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2">OPERATIONAL SOFTWARE / AGENTS / STATE / DEVICE CONTROL</text>
