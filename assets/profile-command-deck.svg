  <text x="600" y="502" text-anchor="middle" fill="#38505f" font-family="ui-monospace,monospace" font-size="9" letter-spacing="2">OPERATIONAL SYSTEMS / CONTROLLED COMPLEXITY / REAL EXECUTION</text>
