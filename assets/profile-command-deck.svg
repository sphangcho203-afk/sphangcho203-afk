    <text x="18" y="28" fill="#ffd700" font-family="ui-monospace,monospace" font-size="11" font-weight="700" letter-spacing="1.4">02 / AI RUNTIME</text>
    <text x="18" y="58" fill="#f3f7fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Reasoning with rails.</text>
    <text x="18" y="84" fill="#8597a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Tools · approvals · routing · evidence</text>
