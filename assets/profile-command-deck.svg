<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Systems engineering command deck</title>
  <desc id="desc">Detailed dark technical interface showing system layers, runtime state, controls, and engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="0.52" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101924" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0a0f16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#bafcff"/>
      <stop offset="0.6" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#153144" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#1b2a37"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)" opacity="0.52"/>

  <circle cx="620" cy="252" r="168" fill="#00f0ff" opacity="0.035" filter="url(#soft)"/>
  <circle cx="620" cy="252" r="102" fill="none" stroke="#00f0ff" stroke-opacity="0.12"/>
  <circle cx="620" cy="252" r="78" fill="none" stroke="#00f0ff" stroke-opacity="0.34" stroke-width="2"/>
  <circle cx="620" cy="252" r="58" fill="none" stroke="#ffd700" stroke-opacity="0.55"/>
  <circle cx="620" cy="252" r="27" fill="url(#core)" filter="url(#glow)"/>
  <path d="M620 146V116M620 388V358M514 252H484M756 252H726" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <path d="M548 180L526 158M694 326L716 348M694 180L716 158M548 326L526 348" stroke="#ffd700" stroke-width="1.6" opacity="0.5"/>

