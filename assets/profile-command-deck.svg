  <path d="M324 190H485" stroke="url(#cyanLine)" stroke-width="2"/>
  <path d="M324 372H485" stroke="url(#cyanLine)" stroke-width="2"/>
  <path d="M755 190H876" stroke="url(#cyanLine)" stroke-width="2"/>
  <path d="M755 372H876" stroke="url(#cyanLine)" stroke-width="2"/>

  <g transform="translate(456 414)">
