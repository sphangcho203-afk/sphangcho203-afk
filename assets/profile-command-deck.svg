    <g transform="translate(18 124)">
      <rect width="76" height="22" rx="7" fill="#0d211b" stroke="#246a54"/><text x="13" y="15" fill="#8bf4cf" font-family="ui-monospace,monospace" font-size="9">SEARCH</text>
      <rect x="84" width="88" height="22" rx="7" fill="#0d211b" stroke="#246a54"/><text x="96" y="15" fill="#8bf4cf" font-family="ui-monospace,monospace" font-size="9">EXTRACT</text>
