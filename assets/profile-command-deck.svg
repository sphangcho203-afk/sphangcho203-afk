      <rect x="82" width="84" height="22" rx="7" fill="#0c1a21" stroke="#154a55"/><text x="95" y="15" fill="#82eef2" font-family="ui-monospace,monospace" font-size="9">IDENTITY</text>
      <rect x="174" width="96" height="22" rx="7" fill="#0c1a21" stroke="#154a55"/><text x="188" y="15" fill="#82eef2" font-family="ui-monospace,monospace" font-size="9">RECOVERY</text>
