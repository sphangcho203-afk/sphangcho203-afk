    <text x="18" y="20" fill="#667c8c" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.3">ENGINEERING LOOP</text>
    <text x="18" y="38" fill="#dbe8ef" font-family="ui-monospace,monospace" font-size="11" font-weight="700">BUILD  →  OBSERVE  →  VERIFY  →  RECOVER  →  SHIP</text>
