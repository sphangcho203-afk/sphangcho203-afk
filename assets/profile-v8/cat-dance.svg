    <path class="face" d="M35 45 l8-3 M83 43 l8 4"/>
  </g>

  <g class="cat c2" transform="translate(245 48)" filter="url(#shadow)">
    <path class="ear" fill="#2d2b34" d="M14 36 L23 8 L43 27 Q61 20 78 29 L98 10 L104 39 Q114 55 109 87 Q103 122 62 126 Q20 123 14 88 Q9 57 14 36Z"/>
    <path class="face" stroke="#f4c4d5" d="M43 58 q7 7 14 0 M69 58 q7 7 14 0 M61 70 q4 4 8 0"/>
