<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="dancing cats">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5f3a48" flood-opacity=".16"/>
    </filter>
    <style>
      .cat{transform-box:fill-box;transform-origin:center bottom;animation:sway 1.18s ease-in-out infinite}
      .pawL,.pawR{transform-box:fill-box;transform-origin:center center}
      .pawL{animation:pawL 1.18s ease-in-out infinite}
      .pawR{animation:pawR 1.18s ease-in-out infinite}
      .ear,.body,.paw{stroke:#3b2b33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
      .face{stroke:#3b2b33;stroke-width:3.2;stroke-linecap:round;fill:none}
      .spark{animation:twinkle 1.18s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .c2,.c2 .pawL,.c2 .pawR,.s2{animation-delay:-.18s}
      .c3,.c3 .pawL,.c3 .pawR,.s3{animation-delay:-.42s}
      .c4,.c4 .pawL,.c4 .pawR,.s4{animation-delay:-.68s}
      .c5,.c5 .pawL,.c5 .pawR,.s5{animation-delay:-.88s}
      @keyframes sway{
        0%,100%{transform:translateY(2px) rotate(-5deg)}
        25%{transform:translateY(-6px) rotate(1deg)}
        50%{transform:translateY(1px) rotate(6deg)}
        75%{transform:translateY(-7px) rotate(-1deg)}
      }
      @keyframes pawL{
        0%,100%{transform:translate(-2px,2px) rotate(-16deg)}
        50%{transform:translate(8px,-7px) rotate(18deg)}
      }
      @keyframes pawR{
        0%,100%{transform:translate(5px,-6px) rotate(14deg)}
        50%{transform:translate(-5px,3px) rotate(-18deg)}
      }
      @keyframes twinkle{
        0%,100%{opacity:.18;transform:scale(.72) rotate(0)}
        50%{opacity:.82;transform:scale(1.05) rotate(12deg)}
      }
      @media (prefers-reduced-motion:reduce){
        .cat,.pawL,.pawR,.spark{animation:none!important}
      }
    </style>
  </defs>

  <path d="M55 151 C185 180 265 137 378 153 S610 181 845 145" fill="none" stroke="#d9a5b8" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <path d="M96 164 C255 130 320 175 469 159 S696 131 812 162" fill="none" stroke="#ead1da" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <g class="spark s1" fill="#d66b98"><path d="M92 48 l5 9 9 5-9 5-5 9-5-9-9-5 9-5z"/></g>
  <g class="spark s2" fill="#e8b2c7"><circle cx="253" cy="38" r="6"/></g>
  <g class="spark s3" fill="#d66b98"><path d="M449 35 l4 7 7 4-7 4-4 7-4-7-7-4 7-4z"/></g>
  <g class="spark s4" fill="#e8b2c7"><circle cx="652" cy="44" r="5"/></g>
  <g class="spark s5" fill="#d66b98"><path d="M819 54 l4 7 7 4-7 4-4 7-4-7-7-4 7-4z"/></g>

  <g class="cat c1" transform="translate(85 46)" filter="url(#shadow)">
