    <path class="face" d="M43 58 q7 7 14 0 M69 58 q7 7 14 0 M61 70 q4 4 8 0"/>
    <path class="paw pawL" fill="#fff9f2" d="M29 77 q13-16 29-3 l15 18 q5 7-2 13 q-7 6-13 0L41 94 q-13 3-17-6 q-4-7 5-11z"/>
    <path class="paw pawR" fill="#fff9f2" d="M87 72 q-9-13-22-5 l-20 17 q-8 7-2 14 q6 7 14 2 l18-10 q9 5 15-2 q5-8-3-16z"/>
    <circle cx="52" cy="48" r="3" fill="#d66b98"/><circle cx="76" cy="48" r="3" fill="#d66b98"/>
  </g>

  <g class="cat c4" transform="translate(565 47)" filter="url(#shadow)">
