  <g class="cat c5" transform="translate(725 45)" filter="url(#shadow)">
    <path class="ear" fill="#f7f3f5" d="M14 36 L23 8 L43 27 Q60 20 78 29 L98 10 L104 39 Q114 55 109 87 Q103 122 62 126 Q20 123 14 88 Q9 57 14 36Z"/>
    <path class="face" d="M43 58 q7 7 14 0 M69 58 q7 7 14 0 M61 70 q4 4 8 0"/>
    <path class="paw pawL" fill="#f0d0dc" d="M29 77 q13-16 29-3 l15 18 q5 7-2 13 q-7 6-13 0L41 94 q-13 3-17-6 q-4-7 5-11z"/>
    <path class="paw pawR" fill="#f0d0dc" d="M87 72 q-9-13-22-5 l-20 17 q-8 7-2 14 q6 7 14 2 l18-10 q9 5 15-2 q5-8-3-16z"/>
    <path d="M90 31 q9 2 13 11" fill="none" stroke="#d66b98" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>