<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Selected systems archive</title><desc id="d">Four dense project dossiers for Recharza, Nexus Forge, Nova Command, and JarvisApp.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a10"/><stop offset="1" stop-color="#111620"/></linearGradient>
  <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18243b"/><stop offset="1" stop-color="#5a3f4a"/></linearGradient>
  <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c2b"/><stop offset="1" stop-color="#314c5c"/></linearGradient>
  <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151724"/><stop offset="1" stop-color="#4c3c55"/></linearGradient>
  <linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151b22"/><stop offset="1" stop-color="#554738"/></linearGradient>
</defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<text x="38" y="43" font-family="ui-monospace, monospace" font-size="12" letter-spacing="4" fill="#eadcc8" opacity=".62">SELECTED SYSTEMS // ARCHIVE DOSSIERS</text>
<text x="951" y="43" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#eadcc8" opacity=".48">four machines, one doctrine</text>
<!-- RECHARZA -->
<g transform="translate(38 68)">
  <rect width="548" height="213" rx="20" fill="url(#p1)" stroke="#ead8bd" stroke-opacity=".25"/>
  <text x="23" y="32" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3" fill="#eadcc8" opacity=".62">ARCHIVE 01 // PRIVATE CORE</text>
  <text x="23" y="78" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f4e6d2">RECHARZA</text>
  <text x="23" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">Game-commerce infrastructure built around real checkout, account,</text>
  <text x="23" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">order, validation and operations flows.</text>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#e6d5be" opacity=".72"><text x="23" y="164">NEXT.JS · POSTGRES · PRISMA</text><text x="23" y="184">AUTH · PAYMENTS · ORDER SYSTEMS</text></g>
  <g transform="translate(447 76)" fill="none" stroke="#f0dcc1"><circle r="48" opacity=".32"/><circle r="28" opacity=".55"/><path d="M-23-23L23 23M23-23L-23 23" opacity=".35"/><path d="M0-58V58M-58 0H58" opacity=".16"/><circle r="6" fill="#f0dcc1" stroke="none"/></g>
</g>
<!-- NEXUS -->
<g transform="translate(614 68)">
  <rect width="548" height="213" rx="20" fill="url(#p2)" stroke="#ead8bd" stroke-opacity=".25"/>
  <text x="23" y="32" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3" fill="#eadcc8" opacity=".62">ARCHIVE 02 // PUBLIC</text>
  <text x="23" y="78" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f4e6d2">NEXUS FORGE</text>
  <text x="23" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">A visual systems experiment: interface architecture, dimensional</text>
  <text x="23" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">presentation and tool-driven workflows.</text>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#e6d5be" opacity=".72"><text x="23" y="164">INTERFACE · TOOLING · EXPERIMENTS</text><text x="23" y="184">DESIGN SYSTEM · FRONTEND</text></g>
  <g transform="translate(450 108)" fill="none" stroke="#f0dcc1" opacity=".6"><path d="M0-54l47 27v54L0 54l-47-27v-54z"/><path d="M0-54v108M-47-27L47 27M47-27L-47 27"/><circle r="8" fill="#f0dcc1" stroke="none"/></g>
</g>
<!-- NOVA -->
<g transform="translate(38 305)">
  <rect width="548" height="213" rx="20" fill="url(#p3)" stroke="#ead8bd" stroke-opacity=".25"/>
  <text x="23" y="32" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3" fill="#eadcc8" opacity=".62">ARCHIVE 03 // PUBLIC</text>
  <text x="23" y="78" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f4e6d2">NOVA COMMAND</text>
  <text x="23" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">Command-layer experiments for automation, operations and structured</text>
  <text x="23" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">control surfaces.</text>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#e6d5be" opacity=".72"><text x="23" y="164">COMMANDS · AUTOMATION · CONTROL</text><text x="23" y="184">AGENTIC OPERATIONS</text></g>
  <g transform="translate(451 111)" fill="none" stroke="#f0dcc1" opacity=".63"><circle r="48"/><circle r="30" stroke-dasharray="5 7"/><circle r="7" fill="#f0dcc1" stroke="none"/><path d="M0-64V64M-64 0H64" opacity=".28"/></g>
</g>
<!-- JARVIS -->
<g transform="translate(614 305)">
  <rect width="548" height="213" rx="20" fill="url(#p4)" stroke="#ead8bd" stroke-opacity=".25"/>
  <text x="23" y="32" font-family="ui-monospace, monospace" font-size="10" letter-spacing="3" fill="#eadcc8" opacity=".62">ARCHIVE 04 // PUBLIC</text>
  <text x="23" y="78" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#f4e6d2">JARVIS APP</text>
  <text x="23" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">Assistant-interface exploration focused on useful control, contextual</text>
  <text x="23" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#e3d9cb" opacity=".72">workflows and a composed operator experience.</text>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#e6d5be" opacity=".72"><text x="23" y="164">ASSISTANT UI · CONTEXT · WORKFLOWS</text><text x="23" y="184">PRODUCT EXPERIMENT</text></g>
  <g transform="translate(452 109)" fill="none" stroke="#f0dcc1" opacity=".62"><path d="M-52 32Q0-66 52 32Q0 3-52 32z"/><circle r="17"/><circle r="5" fill="#f0dcc1" stroke="none"/><path d="M0-42V42" opacity=".35"/></g>
</g>
<rect x="13" y="13" width="1174" height="534" rx="21" fill="none" stroke="#ead8bd" stroke-opacity=".20"/>
</svg>