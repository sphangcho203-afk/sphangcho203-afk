<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Anime civilization profile scene</title><desc id="d">A lone operator overlooks a ruined futuristic city beneath a celestial ring.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090d18"/><stop offset=".56" stop-color="#18223a"/><stop offset="1" stop-color="#372f3d"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="78%" r="48%"><stop stop-color="#ffe3b5" stop-opacity=".95"/><stop offset=".18" stop-color="#d9a888" stop-opacity=".45"/><stop offset=".55" stop-color="#776178" stop-opacity=".12"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
<linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#05070c"/><stop offset=".5" stop-color="#0c1018"/><stop offset="1" stop-color="#05070c"/></linearGradient>
<linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101621"/><stop offset="1" stop-color="#020407"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#sky)"/>
<rect width="1200" height="500" rx="28" fill="url(#sun)"/>
