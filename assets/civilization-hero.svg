<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Civilization Zero operator archive</title><desc id="d">A cinematic systems-operator banner with orbital geometry, city silhouettes, and a typographic interface.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06080d"/><stop offset=".48" stop-color="#101827"/><stop offset="1" stop-color="#261d29"/></linearGradient>
  <linearGradient id="haze" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#e7ad7e" stop-opacity=".22"/><stop offset=".55" stop-color="#7d7186" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ead6bb" stop-opacity="0"/><stop offset=".5" stop-color="#ead6bb" stop-opacity=".8"/><stop offset="1" stop-color="#ead6bb" stop-opacity="0"/></linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop stop-color="#f2ddbd" stop-opacity=".18"/><stop offset=".4" stop-color="#b496a8" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<rect width="1200" height="560" rx="30" fill="url(#haze)"/>
<g opacity=".55" fill="#eee1cf"><circle cx="92" cy="70" r="1.2"/><circle cx="174" cy="122" r="1"/><circle cx="263" cy="56" r="1.4"/><circle cx="396" cy="92" r="1"/><circle cx="544" cy="62" r="1.2"/><circle cx="741" cy="78" r="1"/><circle cx="942" cy="48" r="1.2"/><circle cx="1084" cy="98" r="1.1"/><circle cx="1015" cy="184" r=".8"/></g>
<!-- left typography field -->
<g fill="#f1e5d2">
  <text x="58" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="5" opacity=".58">OPERATOR ARCHIVE // 07</text>
  <text x="56" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="3">CIVILIZATION</text>
  <text x="57" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" letter-spacing="7" opacity=".92">ZERO</text>
  <rect x="58" y="238" width="420" height="1" fill="url(#line)"/>
  <text x="58" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.5" opacity=".76">SYSTEMS / AGENTS / COMMERCE / EXPERIMENTS</text>
  <text x="58" y="315" font-family="system-ui, sans-serif" font-size="15" letter-spacing=".6" opacity=".62">Build the machine. Remove the noise. Let the work carry the identity.</text>
</g>
<!-- right orbital machine -->
<g transform="translate(875 191)" fill="none" stroke="#ead8bd">
  <circle r="154" opacity=".16"/>
  <circle r="119" opacity=".36" stroke-width="1.2"/>
  <circle r="86" opacity=".42" stroke-dasharray="8 10"/>
  <circle r="49" opacity=".58"/>
  <circle r="13" fill="#ead8bd" fill-opacity=".82" stroke="none"/>
  <path d="M0-180V180M-180 0H180" opacity=".14"/>
  <path d="M-126-126L126 126M126-126L-126 126" opacity=".11"/>
  <path d="M0-119A119 119 0 0 1 103 60" stroke-width="4" stroke-linecap="round" opacity=".72"/>
  <circle cx="103" cy="60" r="6" fill="#ead8bd" stroke="none"/>
  <circle cx="-78" cy="-89" r="4" fill="#ead8bd" stroke="none" opacity=".75"/>
</g>
<circle cx="875" cy="191" r="218" fill="url(#orb)"/>
<!-- city horizon -->
<g fill="#080b11" opacity=".96">
  <path d="M0 466V397h44v-38h19v38h30v-85h18v-47h13v47h18v85h38v-48h20v-74h13v74h34v117z"/>
  <path d="M222 466V416h41v-92h14v-41h12v41h19v92h28v-58h21v-31h12v31h33v108z"/>
  <path d="M732 466V415h35v-54h16v-101h14v-39h10v39h19v101h26v54h38v-80h18v-56h14v56h24v80h42v51z"/>
  <path d="M956 466V402h33v-112h16v-56h12v56h17v112h31v-71h18v-48h12v48h27v71h78v64z"/>
</g>
<ellipse cx="740" cy="451" rx="320" ry="42" fill="#eab486" opacity=".10" filter="url(#blur)"/>
<!-- foreground ridge and operator -->
<path d="M0 482l97-22 78 13 89-26 95 17 93-20 112 26 105-21 85 17 101-25 102 24 108-18 135 10v83H0z" fill="#040609"/>
<g transform="translate(614 310)">
  <path d="M49 52c-24 9-36 31-40 59L0 173h154l-9-62c-4-28-18-50-43-59z" fill="#080c13"/>
  <ellipse cx="76" cy="34" rx="28" ry="34" fill="#05070b"/>
  <path d="M47 30q8-40 37-35q28 5 39 38q-15-10-27-5q-20-17-49 2z" fill="#020306"/>
  <path d="M38 65L8 100l26-6-14 30 39-23M113 65l31 35-26-6 14 30-39-23" fill="#080c13"/>
  <g transform="translate(77 106)" fill="none" stroke="#ead8bd" opacity=".65"><circle r="10"/><path d="M-11 0l-31-18 10 17-26-8 27 24 21-8M11 0l31-18-10 17 26-8-27 24-21-8"/></g>
</g>
<!-- system strip -->
<rect x="38" y="495" width="1124" height="38" rx="9" fill="#070a10" stroke="#ead8bd" stroke-opacity=".18"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#e8dbc8">
  <text x="58" y="519" opacity=".62">SIGNAL // STABLE</text>
  <text x="334" y="519" opacity=".62">IDENTITY // MINIMAL</text>
  <text x="642" y="519" opacity=".62">MODE // BUILD</text>
  <text x="917" y="519" opacity=".62">STATUS // ONLINE</text>
</g>
<!-- frame -->
<rect x="13" y="13" width="1174" height="534" rx="23" fill="none" stroke="#ead8bd" stroke-opacity=".28"/>
<path d="M37 82V37h45M1118 37h45v45M37 478v45h45M1118 523h45v-45" fill="none" stroke="#ead8bd" stroke-width="2" opacity=".52"/>
</svg>