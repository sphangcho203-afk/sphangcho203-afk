name: "Architecture Investigation · Case Study"
description: "Document a technical question, system boundary, or design decision that needs investigation."
title: "[INVESTIGATION] "
labels:
  - investigation
  - architecture
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # CRIMSON CASEFILE · ARCHITECTURE INVESTIGATION

        > Not every unknown is a problem. The dangerous ones are the unknowns nobody records.

        Use this form for design questions, performance concerns, integration boundaries, and technical decisions that need evidence before implementation.

  - type: input
    id: question
    attributes:
      label: Investigation question
      description: "What must be understood or decided?"
      placeholder: "Should the service ...?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Current context
      description: "Describe the system as it exists today. Include relevant repositories, services, interfaces, and constraints."
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: "Record compatibility, security, latency, cost, data, or operational constraints."
      placeholder: |
        - Must remain compatible with ...
        - Cannot expose ...
        - Expected scale / latency ...
    validations:
      required: true

  - type: textarea
    id: hypotheses
    attributes:
      label: Current hypotheses
      description: "List the explanations or design options currently under consideration."
      placeholder: |
        1. Option A — ...
        2. Option B — ...
        3. Unknown — ...

  - type: textarea
    id: evidence
    attributes:
      label: Evidence to collect
      description: "Define the logs, benchmarks, traces, experiments, or documentation needed to reach a decision."
      placeholder: |
        - [ ] Reproduce the current behavior.
        - [ ] Measure the relevant path.
        - [ ] Compare the candidate designs.
        - [ ] Record failure and rollback behavior.
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision record
      description: "Complete this section after investigation. Record the selected approach and why it won."

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: "This is an investigation, not an urgent incident report."
          required: true
        - label: "I removed secrets and private data from the casefile."
          required: true
