name: "Thinking Corner"
description: "Open a technical question, design thought, or system idea for discussion."
title: "[THOUGHT] "
labels:
  - discussion
  - thinking
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # thinking corner

        Some questions need a little space before they become tasks. Use this form for design thoughts, performance questions, integrations, and things that are still taking shape.

  - type: input
    id: question
    attributes:
      label: What are you wondering about?
      description: "Write the question in your own words."
      placeholder: "Would it make sense to ...?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: A little context
      description: "Describe the part of the project this relates to."
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Things to keep in mind
      description: "Mention compatibility, privacy, speed, cost, device, or other constraints."
      placeholder: |
        - It should continue to work with ...
        - It should not expose ...
        - It would be nice if ...
    validations:
      required: true

  - type: textarea
    id: ideas
    attributes:
      label: Ideas so far
      description: "List any approaches, sketches, links, or half-formed thoughts."

  - type: textarea
    id: next
    attributes:
      label: What would help next?
      description: "A small experiment, example, benchmark, screenshot, or conversation?"
      placeholder: "Maybe we could try ..."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: "I removed secrets and private information."
          required: true
        - label: "This is open for discussion, not a demand for a specific solution."
          required: true
