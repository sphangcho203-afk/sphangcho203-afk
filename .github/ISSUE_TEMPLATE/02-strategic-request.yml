name: "Strategic Request · New Capability"
description: "Propose a feature, API capability, automation, or architectural improvement."
title: "[REQUEST] "
labels:
  - enhancement
  - needs-review
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # CRIMSON CASEFILE · STRATEGIC REQUEST

        > A good request defines the problem before it prescribes the weapon.

        Keep the proposal specific enough to evaluate and flexible enough to improve.

  - type: input
    id: objective
    attributes:
      label: Objective
      description: "What outcome should exist after this request is complete?"
      placeholder: "Allow the service to ..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: "What user, engineering, or operational problem does this solve?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed execution
      description: "Describe the behavior, interface, data flow, or workflow you have in mind."
      placeholder: |
        - New endpoint / command:
        - Input:
        - Processing:
        - Output:
        - Failure behavior:
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Primary system layer
      options:
        - "API / transport"
        - "Service logic"
        - "Database / persistence"
        - "Authentication / authorization"
        - "Automation / background execution"
        - "Android / client interface"
        - "Documentation / developer experience"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "What other approaches were rejected, and why?"

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: "How will we know the request is complete and working?"
      placeholder: |
        - [ ] Behavior is covered by tests.
        - [ ] Failure states are defined.
        - [ ] Documentation is updated.
        - [ ] Existing interfaces remain compatible.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: "I searched existing issues and discussions before opening this request."
          required: true
        - label: "I have described the problem, not only the desired implementation."
          required: true
