name: "Soft Red · Check In"

# A small, friendly verification workflow for APIs, services, bots, and Android projects.
# Copy this file into .github/workflows/ in another repository and adjust the commands
# that are specific to that project.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soft-red-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    name: "A small check-in"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Open the project"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Leave a little note"
        shell: bash
        run: |
          {
            echo "## A small check-in"
            echo ""
            echo "- **Repository:** ${{ github.repository }}"
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo ""
            echo "> Checking the project gently, one part at a time."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "See what is here"
        id: stack
        shell: bash
        run: |
          has_python=false
          has_node=false
          has_gradle=false

          [[ -f pyproject.toml || -f requirements.txt || -f setup.py ]] && has_python=true
          [[ -f package.json ]] && has_node=true
          [[ -f gradlew ]] && has_gradle=true

          echo "has_python=$has_python" >> "$GITHUB_OUTPUT"
          echo "has_node=$has_node" >> "$GITHUB_OUTPUT"
          echo "has_gradle=$has_gradle" >> "$GITHUB_OUTPUT"

          {
            echo "## What was found"
            echo ""
            echo "| Part | Found |"
            echo "| --- | --- |"
            echo "| Python | $has_python |"
            echo "| Node.js | $has_node |"
            echo "| Gradle / Android | $has_gradle |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Prepare Python"
        if: steps.stack.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "Prepare Node.js"
        if: steps.stack.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Prepare Java for Android / Gradle"
        if: steps.stack.outputs.has_gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "Install Python dependencies"
        if: steps.stack.outputs.has_python == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            python -m pip install -e .
          fi

      - name: "Install Node dependencies"
        if: steps.stack.outputs.has_node == 'true'
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: "Check for accidental whitespace"
        shell: bash
        run: git diff --check

      - name: "Check Python projects"
        if: steps.stack.outputs.has_python == 'true'
        shell: bash
        run: |
          python -m compileall -q .
          if [[ -d tests ]]; then
            python -m pytest -q
          elif python -c "import importlib.util; raise SystemExit(0 if importlib.util.find_spec('pytest') else 1)" 2>/dev/null; then
            python -m pytest -q
          else
            echo "No pytest suite found; compilation completed."
          fi

      - name: "Check Node projects"
        if: steps.stack.outputs.has_node == 'true'
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)" 2>/dev/null; then
            npm run lint
          fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)" 2>/dev/null; then
            npm test -- --if-present
          else
            echo "No test script found; dependency installation completed."
          fi

      - name: "Check Android / Gradle projects"
        if: steps.stack.outputs.has_gradle == 'true'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon --stacktrace

      - name: "Finish the check-in"
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Finished"
            echo ""
            echo "This check-in completed with status: **${{ job.status }}**"
            echo ""
            echo "> Small progress still counts."
          } >> "$GITHUB_STEP_SUMMARY"
